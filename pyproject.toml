[project]
name = "tesse"
version = "0.1.0"
description = "Tesse: catálogo de estratégias de mercado e executor TEST Ebinex"
requires-python = ">=3.14"
dependencies = ["ebinex-sdk>=0.1.0.dev0", "PyYAML>=6.0.3,<7", "packaging>=24", "numpy>=2.4,<3", "TA-Lib==0.8.3", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
ml-xgboost = ["xgboost==3.4.1", "scikit-learn==1.9.1"]
ml = ["scikit-learn==1.9.1", "scipy>=1.17,<2", "joblib>=1.5,<2", "threadpoolctl>=3.6,<4"]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "hypothesis>=6.170.15,<7"]

[project.scripts]
tesse = "tesse.cli:main"
ebinex-bot = "tesse.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tesse*"]

[tool.setuptools.package-data]
"tesse.forge" = ["artifacts.yaml", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
